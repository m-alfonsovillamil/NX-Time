# Los tests de interfaz (Robolectric) no arrancan NxTimeApplication: esa
# registra el push, Sentry y WorkManager al crearse, y nada de eso hace falta
# para pintar una pantalla. Cada test le pasa a la pantalla su ViewModel.
# (NavegacionTest sí la arranca, a propósito: lo dice en su @Config.)
application=android.app.Application

# Una pantalla de móvil corriente. La de Robolectric por defecto es de
# 320 x 470 dp, y en ella medio formulario queda fuera de la vista.
qualifiers=w411dp-h891dp-xhdpi
