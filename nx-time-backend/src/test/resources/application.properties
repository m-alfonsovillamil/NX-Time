# Solo para los tests. Spring Boot lo carga ADEMÁS del application.yml de
# main, y lo que se pone aquí gana.
#
# El pool de conexiones, pequeño (09/2026). Cada test de integración con su
# propia configuración (@DynamicPropertySource con una base efímera, o un
# @Import distinto) levanta un contexto de Spring aparte, y Spring los guarda
# en caché con su pool ABIERTO para reutilizarlos. Con el pool por defecto de
# HikariCP (10) y el max_connections por defecto de PostgreSQL (100), el
# décimo contexto agota las conexiones y su test falla con "remaining
# connection slots are reserved for roles with the SUPERUSER attribute",
# que llega disfrazado de "Unable to determine Dialect without JDBC metadata".
#
# Pasó al añadir PersonalDataExportIT: con nueve contextos cabían justos. Los
# tests van en un solo hilo y ninguno abre conexiones en paralelo, así que 4
# sobran, y dejan sitio para más de veinte contextos.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
