# Solo para los tests (lo lee SpringProperties de la raíz del classpath).
#
# Cuántos contextos de Spring se guardan en caché entre clases de test. Por
# defecto son 32, y aquí casi nunca se reutilizan: cada test de integración se
# crea su propia base efímera con @DynamicPropertySource, así que su contexto es
# único y nadie más lo vuelve a pedir. Guardarlos todos abiertos solo acumula
# memoria (y un pool de conexiones por contexto, ver application.properties).
#
# Pasó al añadir PushIT (Fase B5): con treinta contextos vivos la JVM de los
# tests se quedó sin heap (OutOfMemoryError) y arrastró 130 tests, casi todos
# del contrato, que fallaban en cadena con 401 y respuestas HTML. Con 8, los
# que se reutilizan de verdad (los @WebMvcTest, que comparten configuración)
# siguen en caché y el resto se cierra al salir de la lista.
spring.test.context.cache.maxSize=8
