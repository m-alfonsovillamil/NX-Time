# Perfil de desarrollo local: PostgreSQL en Docker (ver docker-compose.yml
# en la raíz del monorepo -- puerto 5433, no 5432, para no chocar con
# instalaciones nativas de Postgres que pueda tener la máquina).
#
# Uso: ./gradlew bootRun --args='--spring.profiles.active=dev'
# (añade ",demo" para arrancar además con datos de ejemplo: ver
# demo/DemoDataSeeder.java)
#
# Los correos (Fase 10) van a MailHog, el servidor SMTP de mentira que
# levanta docker-compose: no sale nada a internet y se leen todos en
# http://localhost:8025. Los valores por defecto de application.yml
# (localhost:1025, sin auth) ya apuntan ahí, no hace falta repetirlos.

spring:
  # Fase 8: "nxtime_app" es un rol SIN privilegios de superusuario ni
  # de DDL (ver docker/postgres/init-app-role.sql), a diferencia de
  # "nxtime" (el rol de bootstrap de la imagen oficial de Postgres,
  # superusuario del clúster local). Es lo que hace que el REVOKE de
  # UPDATE/DELETE sobre auditoria_fichaje (ver V3__audit_trail.sql) sea
  # una restricción real -- contra un superusuario, cualquier REVOKE es
  # papel mojado. Flyway migra por separado como "nxtime": necesita
  # crear/alterar tablas, algo que "nxtime_app" no puede ni debe hacer.
  datasource:
    url: jdbc:postgresql://localhost:5433/nxtime
    username: nxtime_app
    password: nxtime_app

  flyway:
    url: jdbc:postgresql://localhost:5433/nxtime
    user: nxtime
    password: nxtime

  jpa:
    show-sql: true

  # Sin caché de plantillas en desarrollo: así se puede tocar un correo
  # de templates/email/ y ver el cambio sin reiniciar.
  thymeleaf:
    cache: false

application:
  security:
    cors:
      # Permisivo a propósito en desarrollo local: no hay frontend web
      # real todavía (la app Android no manda cabecera Origin), y esto
      # solo se usaría para probar la API desde el navegador. En
      # producción NO es "*" -- ver application-prod.yml.
      allowed-origins: "*"
