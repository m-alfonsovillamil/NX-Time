# Perfil de producción: PostgreSQL en Neon (ver Fase 11 del plan --
# despliegue en Render). Todo por variables de entorno, nada
# hardcodeado: DATABASE_URL/DATABASE_USERNAME/DATABASE_PASSWORD los
# da el panel de Neon (usa el connection string en formato JDBC que
# ofrece, o compón la URL a partir de host/base/usuario/contraseña).
#
# El tuning de HikariCP para el cold start del plan gratuito de Neon
# (la Fase 11 lo detalla) se añade cuando se despliegue de verdad, no
# antes.
#
# TODO (Fase 11): en dev, "spring.datasource" (runtime, sin DDL) y
# "spring.flyway" (migraciones) usan roles de Postgres DISTINTOS -- ver
# application-dev.yml y docker/postgres/init-app-role.sql -- porque es
# lo único que hace real la restricción de UPDATE/DELETE sobre
# auditoria_fichaje (Fase 8, ver V3__audit_trail.sql): contra un
# superusuario o el propio dueño de la tabla, cualquier REVOKE es papel
# mojado. Aquí, de momento, las dos cosas comparten un único rol de
# Neon (DATABASE_USERNAME) -- pendiente de crear un segundo rol de
# Neon de mínimo privilegio (solo SELECT/INSERT en auditoria_fichaje,
# sin CREATE) cuando se despliegue de verdad, igual que en local.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    show-sql: false

application:
  security:
    cors:
      # Sin frontend web todavía: la app Android no manda cabecera
      # Origin, así que CORS no le afecta. En cuanto haya un dominio
      # real que consuma la API desde el navegador, se añade aquí
      # (nunca "*" en producción -- ver auditoría, defectos de diseño).
      allowed-origins: "${CORS_ALLOWED_ORIGINS:}"
