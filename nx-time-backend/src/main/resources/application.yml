# Configuración común a todos los perfiles. Lo específico de cada
# entorno (dónde está la base de datos, sobre todo) vive en
# application-dev.yml / application-prod.yml.

spring:
  jpa:
    # El esquema lo crea y versiona Flyway (ver
    # resources/db/migration/), no Hibernate: "validate" comprueba que
    # las entidades coinciden con lo que Flyway ya aplicó, pero nunca
    # modifica el esquema él solo. Antes, con SQLite, era "update": sin
    # control de versiones, sin claves foráneas, sin índices (ver
    # auditoría).
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    # Por defecto Spring Boot mantiene la conexión abierta durante TODA
    # la petición (incluida la fase de renderizado), no solo durante la
    # transacción -- lo que además esconde N+1 hasta que la vista fuerza
    # la carga perezosa. Es la recomendación estándar de Spring Boot.
    open-in-view: false

  # Convierte automáticamente las excepciones "estándar" de Spring MVC
  # (validación con @Valid, JSON malformado, método HTTP no soportado...)
  # en ProblemDetail (RFC 7807), sin pasar por response.sendError() ni
  # por el dispatch a "/error" que hoy intercepta el filtro de
  # seguridad (ver GlobalExceptionHandler y el commit de la Fase 0).
  mvc:
    problemdetails:
      enabled: true

# Cada línea de log lleva el requestId de CorrelationIdFilter, para
# poder seguir todas las líneas de una misma petición aunque pasen por
# varias clases.
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"

# Configuración personalizada de la aplicación
application:
  security:
    jwt:
      # Clave secreta HMAC. Se lee de la variable de entorno JWT_SECRET.
      # El valor por defecto SOLO es válido para desarrollo local: es una
      # clave nueva generada para este repo (la anterior quedó expuesta en
      # git y se considera comprometida). En producción se sobreescribe
      # siempre con una variable de entorno propia (ver application-prod.yml).
      secret-key: "${JWT_SECRET:PXPGUXRppB7TpSN+W65Sl9qIKhKIOS6vxftZBZLCI4iIuCPt4CzTchUL4BFScNcgXWhlQess0tQaSOy8PABnRQ==}"

      # Access token: 15 minutos (antes 1 día -- ver plan, Fase 4: un
      # token robado ahora vale poco tiempo). Corto a propósito porque
      # existe refresh-expiration para renovarlo sin pedir contraseña.
      expiration: 900000

      # Refresh token: 30 días. Se guarda en BD (ver RefreshToken) y es
      # revocable de verdad -- a diferencia del access token, que es un
      # JWT firmado sin estado y no se puede invalidar antes de que
      # caduque por su cuenta.
      refresh-expiration: 2592000000
    cors:
      # Lista de orígenes permitidos, separados por coma. Antes era "*"
      # fijo en el código (ver auditoría, defectos de diseño). Por
      # defecto vacío (ningún origen de navegador permitido): la app
      # Android no manda cabecera Origin, así que CORS no le afecta;
      # esto solo importa si algún día hay un cliente web. Cada perfil
      # sobreescribe este valor -- ver application-dev.yml / application-prod.yml.
      allowed-origins: ""
