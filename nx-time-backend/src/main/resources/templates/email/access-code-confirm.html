<!DOCTYPE html>
<!--/* Confirmar el correo al registrar una empresa (V37, ADR 034). */-->
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/layout :: marco('Confirma tu correo', ~{:: #contenido})}">
<div id="contenido">
    <p>Hola <span th:text="${nombre}">Nombre</span>,</p>

    <p>Has registrado <strong th:text="${nombreEmpresa}">tu empresa</strong> en NX Time. Para entrar,
        confirma que este correo es tuyo escribiendo este código:</p>

    <p style="font-size: 30px; font-weight: bold; letter-spacing: 8px; margin: 20px 0;"
       th:text="${codigo}">123456</p>

    <p>Caduca en <span th:text="${validez}">1 hora</span> y solo sirve una vez.</p>

    <!--/*
      Quien no lo ha pedido no tiene que hacer nada: sin el código, la cuenta
      que alguien dejó a medias con su correo no se puede usar.
    */-->
    <p style="color: #6a737d;">
        Si no has sido tú, no hagas nada: sin este código nadie puede usar tu correo en NX Time.
    </p>
</div>
</body>
</html>
