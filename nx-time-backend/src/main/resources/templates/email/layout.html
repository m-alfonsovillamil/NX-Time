<!DOCTYPE html>
<!--/*
  Fragmento común a todos los correos (Fase 10). Los estilos van EN
  LÍNEA a propósito: la mayoría de clientes de correo ignoran o
  recortan las hojas de estilo y las etiquetas <style>, así que un CSS
  "bonito" en el <head> se pierde justo donde importa.
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="marco(titulo, contenido)"
     style="font-family: Arial, Helvetica, sans-serif; color: #222; max-width: 560px; margin: 0 auto;">

    <div style="background: #1f6feb; color: #fff; padding: 16px 20px; border-radius: 6px 6px 0 0;">
        <h1 style="margin: 0; font-size: 18px;">NX Time</h1>
    </div>

    <div style="border: 1px solid #e1e4e8; border-top: none; padding: 20px; border-radius: 0 0 6px 6px;">
        <h2 style="margin-top: 0; font-size: 16px;" th:text="${titulo}">Título</h2>
        <div th:replace="${contenido}">Contenido</div>

        <!--/*
          El botón a la operativa del correo (BotonDelCorreo). Es una tabla y
          no un <a> con padding porque Outlook ignora el padding de los
          enlaces: con la tabla, el botón se ve igual en todos los clientes. El
          enlace en texto de debajo es para quien tenga el HTML recortado.
        */-->
        <table th:if="${botonUrl != null}" role="presentation" cellpadding="0" cellspacing="0" border="0"
               style="margin: 24px 0 8px;">
            <tr>
                <td style="background: #1f6feb; border-radius: 6px;">
                    <a th:href="${botonUrl}" href="#" th:text="${botonTexto}"
                       style="display: inline-block; padding: 12px 20px; color: #ffffff; font-weight: bold;
                              text-decoration: none; font-family: Arial, Helvetica, sans-serif;">Abrir</a>
                </td>
            </tr>
        </table>
        <p th:if="${botonUrl != null}" style="margin: 0; font-size: 12px; color: #6a737d;">
            O copia esta dirección en el navegador:
            <a th:href="${botonUrl}" href="#" th:text="${botonUrl}" style="color: #1f6feb;">enlace</a>
        </p>

        <p style="margin-top: 24px; font-size: 12px; color: #6a737d;">
            Este es un mensaje automático de NX Time; no hace falta responder.
        </p>
    </div>
</div>
</body>
</html>
