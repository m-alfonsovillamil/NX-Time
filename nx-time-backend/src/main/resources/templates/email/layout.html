<!DOCTYPE html>
<!--/*
  Fragmento común a todos los correos (Fase 10), con la línea visual de la app
  y la web desde noviembre de 2026: el icono de la N, el teal de la marca,
  tarjeta blanca redondeada sobre el fondo claro y Sora en los titulares.

  - Los estilos van EN LÍNEA a propósito: la mayoría de clientes de correo
    ignoran o recortan las hojas de estilo y las etiquetas <style>.
  - Es una maqueta de TABLAS, no de <div>: Outlook pinta con el motor de Word y
    no respeta ni max-width ni el padding de un <div>.
  - Los colores son SOLO los de config/Marca.java (lo comprueba MarcaTest): si
    hace falta otro, se añade allí, que es la copia del tema de Android.
  - Sora casi nunca está instalada en quien lee el correo: los titulares caen
    en Arial, que es lo que se ve en la mayoría. Es a propósito; descargar una
    fuente en un correo no funciona en casi ningún cliente.
  - El nombre, el titular, la web y el icono vienen de la configuración del
    titular (EmailSender los añade): el día que cambie el nombre, no se toca
    ninguna plantilla.
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="marco(titulo, contenido)"
     style="margin: 0; padding: 24px 12px; background: #F6EFE1;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="max-width: 560px; margin: 0 auto; font-family: Arial, Helvetica, sans-serif; color: #1C2327;">

    <!--/* La marca: el icono y el nombre, fuera de la tarjeta, como en la web. */-->
    <tr>
        <td style="padding: 0 4px 16px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td th:if="${urlIcono != null}" style="padding-right: 10px; vertical-align: middle;">
                        <img th:src="${urlIcono}" src="#" width="36" height="36" th:alt="${producto}" alt=""
                             style="display: block; border: 0; border-radius: 8px;">
                    </td>
                    <td style="vertical-align: middle; font-family: 'Sora', Arial, Helvetica, sans-serif;
                               font-size: 20px; font-weight: bold; color: #1F3A5F;"
                        th:text="${producto}">NX Time</td>
                </tr>
            </table>
        </td>
    </tr>

    <!--/* La tarjeta, con las esquinas de 16 de la línea visual. */-->
    <tr>
        <td style="background: #FFFAF1; border: 1px solid #D6CBB5; border-radius: 16px;
                   padding: 28px 24px; font-size: 15px; line-height: 1.55;">
            <h2 style="margin: 0 0 16px; font-family: 'Sora', Arial, Helvetica, sans-serif;
                       font-size: 20px; line-height: 1.3; color: #1C2327;" th:text="${titulo}">Título</h2>
            <div th:replace="${contenido}">Contenido</div>

            <!--/*
              El botón a la operativa del correo (BotonDelCorreo). Es una tabla
              y no un <a> con padding porque Outlook ignora el padding de los
              enlaces: con la tabla, el botón se ve igual en todos los clientes.
              El enlace en texto de debajo es para quien tenga el HTML recortado.
            */-->
            <table th:if="${botonUrl != null}" role="presentation" cellpadding="0" cellspacing="0" border="0"
                   style="margin: 28px 0 10px;" data-nx="boton">
                <tr>
                    <td style="background: #1F3A5F; border-radius: 20px;">
                        <a th:href="${botonUrl}" href="#" th:text="${botonTexto}"
                           style="display: inline-block; padding: 12px 24px; color: #FFFFFF; font-weight: bold;
                                  font-size: 15px; text-decoration: none; border-radius: 20px;
                                  font-family: Arial, Helvetica, sans-serif;">Abrir</a>
                    </td>
                </tr>
            </table>
            <p th:if="${botonUrl != null}" style="margin: 0; font-size: 12px; color: #565040;">
                O copia esta dirección en el navegador:
                <a th:href="${botonUrl}" href="#" th:text="${botonUrl}" style="color: #1F3A5F;">enlace</a>
            </p>
        </td>
    </tr>

    <!--/* El pie: qué es esto y quién lo manda. */-->
    <tr>
        <td style="padding: 16px 8px 0; font-size: 12px; line-height: 1.5; color: #565040; text-align: center;">
            Mensaje automático de <span th:text="${producto}">NX Time</span>; no hace falta responder.
            <span th:if="${titular != null}"><br><span th:text="${producto}">NX Time</span> es un servicio
                de <span th:text="${titular}">su titular</span>.</span>
            <span th:if="${web != null}">
                <a th:href="${web} + '/legal/privacidad'" href="#" style="color: #1F3A5F;">Privacidad</a>
            </span>
        </td>
    </tr>
</table>
</div>
</body>
</html>
