# Despliegue en Render (Fase 11 del plan de profesionalización).
#
# "Blueprint" de Render: en vez de configurar el servicio a mano por el
# panel, queda declarado aquí y versionado con el código. Render lo lee
# al conectar el repositorio.
#
# La base de datos NO se declara aquí: se usa Neon (PostgreSQL
# gestionado, con plan gratuito más generoso que el de Render) y su
# cadena de conexión entra por variables de entorno.
services:
  - type: web
    name: nxtime-backend
    runtime: docker
    # El mismo Dockerfile multi-stage de la Fase 7 que ya se usa en
    # local: la imagen que se despliega es la que se prueba.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt   # el más cercano a España de los disponibles
    branch: main

    # Render reinicia el servicio si esto deja de responder. Es el
    # endpoint de Actuator de la Fase 7, público y sin detalles
    # (show-details: never), así que no filtra el estado de la base de
    # datos a internet.
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ---------------------------------------------------------------
      # Secretos: sync=false significa que NO van en este fichero. Render
      # los pide al crear el servicio y quedan guardados en su panel.
      # Ninguno tiene valor por defecto a propósito.
      # ---------------------------------------------------------------

      # De Neon. Formato JDBC, p. ej.:
      # jdbc:postgresql://ep-xxx.eu-central-1.aws.neon.tech/nxtime?sslmode=require
      #
      # El host va CON el sufijo "-pooler": la aplicación atiende
      # peticiones concurrentes y Neon recomienda el pooler para eso.
      - key: DATABASE_URL
        sync: false
      # El rol de mínimo privilegio de la Fase 8, NO el dueño de la base.
      # Es lo que hace que el REVOKE sobre auditoria_fichaje signifique
      # algo: el propietario de una tabla siempre puede saltarse sus
      # propios permisos.
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # Migraciones (Flyway). Van APARTE del datasource de arriba, y por
      # dos motivos independientes que se acumulan -- están explicados
      # con detalle en application-prod.yml:
      #
      #  1. ROL DISTINTO. Flyway necesita crear y alterar tablas, y el
      #     rol de la aplicación no puede ni debe. Sin estas variables,
      #     application-prod.yml las hereda del datasource y Flyway
      #     intentaría migrar como el rol de aplicación: el despliegue
      #     falla al arrancar. Falla de forma ruidosa a propósito, pero
      #     falla.
      #
      #  2. CONEXIÓN DIRECTA, NO POOLED. El host es el mismo pero SIN el
      #     sufijo "-pooler": PgBouncer en modo transacción no soporta
      #     SET, que las herramientas de migración usan.
      #
      # Se declaran aquí, y no solo en docs/DESPLIEGUE.md, para que
      # Render las pida al crear el servicio desde este blueprint. Que
      # faltaran obligaba a añadirlas a mano por el panel después, y no
      # había nada que lo recordara.
      - key: SPRING_FLYWAY_URL
        sync: false
      - key: SPRING_FLYWAY_USER
        sync: false
      - key: SPRING_FLYWAY_PASSWORD
        sync: false

      # Clave de firma de los JWT. Sin ella la aplicación NO ARRANCA, y
      # es deliberado: application.yml trae una clave por defecto para
      # desarrollo que es PÚBLICA (está en el repositorio), así que
      # heredarla en producción permitiría a cualquiera firmar tokens
      # válidos. Ver application-prod.yml.
      # Generar con: openssl rand -base64 64
      - key: JWT_SECRET
        sync: false

      # SMTP real (Brevo, Resend... en su plan gratuito). MailHog solo
      # existe en local.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      # Debe ser un dominio verificado en el proveedor SMTP o los
      # correos acabarán en spam.
      - key: MAIL_FROM
        sync: false

      # Push (Fase B5, ADR 028): el JSON de la cuenta de servicio de
      # Firebase, EN BASE64 (Render maltrata los saltos de línea de la clave
      # privada). Es un secreto: puede mandar push a toda la plantilla. Sin
      # ella la aplicación arranca igual y simplemente no manda push.
      # Generar con: base64 -w0 cuenta-de-servicio.json
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

      # Orígenes permitidos para CORS, separados por comas y SIN barra final
      # ("https://nxtime-web.onrender.com", no ".../"). Vacío mientras no haya
      # un cliente web: la app Android no manda cabecera Origin y CORS no le
      # afecta.
      #
      # 🚨 El día que se despliegue una web hay que poner esto A MANO en el
      # panel de Render. Si se olvida, la web compila, despliega y no funciona:
      # el navegador da un error de CORS en su consola y en los logs del
      # backend no aparece NADA, porque la petición ni siquiera llega. Por eso
      # el backend avisa con un WARN al arrancar en producción si está vacío.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Sentry (paso 5 del piloto): adónde van los errores del backend.
      # Vacía, la aplicación arranca igual y no envía nada. El DSN no da
      # acceso a leer nada -- solo identifica adónde mandar los errores --,
      # pero no pinta nada en un repositorio público.
      - key: SENTRY_DSN
        sync: false

  # -------------------------------------------------------------------
  # El cliente web (Fase C5). Un STATIC SITE, no un segundo `type: web`
  # con Node sirviendo ficheros: un static site no es una instancia y no
  # consume las 750 horas al mes del plan gratuito. Un segundo servicio
  # web sí, y dejaría al backend sin margen -- que ya gasta bastante con
  # keep-alive.yml manteniéndolo despierto.
  #
  # 🚨 Desplegar esto NO basta. Hay que poner su URL en CORS_ALLOWED_ORIGINS
  # del backend (arriba), a mano, en el panel. Ver docs/DESPLIEGUE.md.
  # -------------------------------------------------------------------
  - type: web
    name: nxtime-web
    runtime: static
    branch: main
    # Con rootDir, Render solo despliega cuando cambia algo dentro de este
    # directorio: un cambio en el backend no reconstruye la web.
    rootDir: nx-time-frontend-web
    # `--include=dev` no es de adorno. Vite, TypeScript y el plugin de React
    # son devDependencies, y si el entorno de build tuviera NODE_ENV en
    # `production`, `npm ci` a secas se las saltaría y el build fallaría con
    # "vite: not found". Así da igual lo que ponga el entorno.
    #
    # La versión de Node sale de nx-time-frontend-web/.node-version, el mismo
    # fichero que lee el CI.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist

    envVars:
      # Se hornea en el JavaScript al construir: cambiarlo exige volver a
      # desplegar la web, no basta con reiniciar nada. No es un secreto --
      # cualquiera lo ve en las herramientas del navegador --, así que va
      # aquí con su valor.
      - key: VITE_API_URL
        value: https://nxtime-backend.onrender.com

    # Es una SPA: /fichar no existe como fichero, lo resuelve react-router
    # en el navegador. Sin esta regla, pulsar F5 en /fichar da un 404 de
    # Render. Los ficheros que sí existen (/assets/...) se sirven antes de
    # llegar aquí.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # La CSP más estricta que admite la aplicación, comprobada contra el
      # build real antes de escribirla aquí:
      #  - script-src/style-src 'self': Vite no mete ni un script en línea
      #    en index.html, y los estilos van en un .css aparte.
      #  - font-src 'self': Sora va empaquetada (@fontsource), no se pide a
      #    Google Fonts.
      #  - connect-src: el propio origen y el backend. Si el backend cambia
      #    de URL, hay que tocarlo aquí Y en VITE_API_URL.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://nxtime-backend.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Las mismas que manda el backend (A10), para que la web no sea el
      # eslabón flojo.
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Vite pone un hash del contenido en el nombre de cada fichero de
      # /assets, así que uno de ellos no cambia nunca: si cambia el
      # contenido, cambia el nombre. Se puede guardar para siempre.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html NO lleva regla propia, y es a propósito. Las cabeceras se
      # asignan por la ruta PEDIDA, no por el fichero servido: una regla en
      # /index.html no alcanzaría a / ni a /fichar, que sirven ese mismo
      # fichero a través de la reescritura de arriba. Sería una protección
      # que no protege. Lo que devuelve Render ahí se comprueba tras el
      # despliegue (docs/DESPLIEGUE.md, "La web").

# ---------------------------------------------------------------------
# Dos avisos del plan gratuito, que conviene saber ANTES de enseñar
# esto en una entrevista:
#
#  1. Render DUERME el servicio tras 15 minutos sin tráfico, y despertarlo
#     tarda: medido entre 160 y 193 s (09-11/09/2026). Lo mantiene
#     despierto .github/workflows/keep-alive.yml, y la app espera hasta
#     300 s cuando puede estar dormido (ver docs/DESPLIEGUE.md).
#
#  2. Neon SUSPENDE la base de datos por inactividad. El primer acceso
#     tras la pausa tarda varios segundos; por eso application-prod.yml
#     sube el connection-timeout de HikariCP a 45 s.
#
#  3. Dormido, el servicio tampoco ejecuta las tareas nocturnas de las 3:00
#     y las 3:30. Lo vigila .github/workflows/tareas-nocturnas.yml.
# ---------------------------------------------------------------------
