services:
  postgres:
    # PostgreSQL 18, la MISMA versión mayor que corre en Neon (ver
    # docs/DESPLIEGUE.md). Antes era la 16: los tests validaban contra
    # una versión distinta de la de producción, que es justo la paridad
    # dev/prod que este proyecto defiende en todo lo demás.
    #
    # Al subir de versión, el volumen de datos existente deja de servir
    # (el directorio de datos de PostgreSQL es específico de cada
    # versión mayor) y el contenedor no arranca. Si te encuentras con
    # "database files are incompatible with server":
    #     docker compose down -v && docker compose up -d postgres
    # Se pierde el seed de demo, que es desechable por diseño, y de paso
    # se vuelve a ejecutar init-app-role.sql.
    image: postgres:18-alpine
    container_name: nxtime-postgres
    environment:
      POSTGRES_DB: nxtime
      POSTGRES_USER: nxtime
      POSTGRES_PASSWORD: nxtime
    ports:
      # Host 5433 -> contenedor 5432. No usamos el 5432 del host a
      # propósito: así "docker compose up" funciona igual en cualquier
      # máquina, tenga o no un PostgreSQL nativo ya escuchando en el
      # 5432 (como en esta, con un PostgreSQL 18 instalado aparte).
      - "5433:5432"
    volumes:
      # Montado en /var/lib/postgresql, NO en /var/lib/postgresql/data.
      # Es un cambio de convención de la imagen oficial a partir de la
      # 18: ahora guarda los datos en un subdirectorio por versión mayor
      # (/var/lib/postgresql/18/docker), igual que hace pg_ctlcluster,
      # para que un futuro "pg_upgrade --link" no choque con el punto de
      # montaje. Con el montaje antiguo, la imagen 18 se niega a
      # arrancar y avisa de "PostgreSQL data in ... (unused mount/volume)".
      - nxtime-postgres-data:/var/lib/postgresql
      # Solo se ejecuta la primera vez que se crea el volumen de datos
      # (convención de la imagen oficial, docker-entrypoint-initdb.d) --
      # ver ese fichero para cómo crear el rol a mano en un volumen ya
      # existente de antes de la Fase 8.
      - ./docker/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/init-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nxtime -d nxtime"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: nxtime-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Servidor SMTP de mentira para desarrollo (Fase 7, en uso desde la
  # Fase 10): captura cualquier correo que el backend envíe sin
  # reenviarlo a ningún sitio real, así que se pueden probar las
  # notificaciones sin mandar correos de verdad a nadie.
  # Los correos se leen en http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nxtime-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # El backend en sí, construido con el Dockerfile de la raíz. Opcional
  # para el día a día de desarrollo (seguir usando
  # "./gradlew bootRun --args=--spring.profiles.active=dev" desde el
  # IDE es más cómodo: recarga en caliente con devtools, breakpoints...)
  # pero necesario para "docker compose up" como demo end-to-end
  # reproducible sin tener instalado ni Java ni Gradle.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nxtime-backend
    environment:
      # "dev,demo": arranca ya con datos de ejemplo (ver
      # demo/DemoDataSeeder.java) para que quien levante esto por
      # primera vez vea algo con contenido en 30 segundos.
      SPRING_PROFILES_ACTIVE: dev,demo
      # Sobreescriben lo que trae application-dev.yml (localhost:5433,
      # el puerto PUBLICADO en el host): dentro de la red de Docker
      # Compose, "postgres" es el nombre del servicio y 5432 su puerto
      # interno, no el publicado. Las variables de entorno tienen
      # prioridad sobre application-{perfil}.yml en Spring Boot, así
      # que no hace falta un perfil nuevo solo para esto.
      #
      # Runtime como "nxtime_app" (sin privilegios de superusuario ni de
      # DDL, ver docker/postgres/init-app-role.sql), Flyway como
      # "nxtime" (necesita crear/alterar tablas) -- Fase 8: es lo que
      # hace que el REVOKE de UPDATE/DELETE sobre auditoria_fichaje sea
      # una restricción real, no papel mojado (ver V3__audit_trail.sql).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nxtime
      SPRING_DATASOURCE_USERNAME: nxtime_app
      SPRING_DATASOURCE_PASSWORD: nxtime_app
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/nxtime
      SPRING_FLYWAY_USER: nxtime
      SPRING_FLYWAY_PASSWORD: nxtime
      # Igual que con Postgres: dentro de la red de Compose el host es
      # el nombre del servicio, no localhost (Fase 10).
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  nxtime-postgres-data:
