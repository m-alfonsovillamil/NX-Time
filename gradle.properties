android.useAndroidX=true
android.enableJetifier=true

# Memoria del demonio de Gradle.
#
# Sin esta línea Gradle usa su valor por defecto, 512 MiB, que bastaba
# para la app de vistas XML pero no para Compose: el dexado con D8 del
# APK de depuración se queda sin heap y el build muere con
# "java.lang.OutOfMemoryError: Java heap space" en
# mergeDevDebugGlobalSynthetics.
#
# Afecta igual a la máquina de desarrollo y al runner de GitHub Actions,
# que tampoco configura nada por su cuenta.
#
# file.encoding: el código y los mensajes están en castellano, y sin
# esto el compilador los lee con la codificación por defecto de la
# máquina, que no siempre es UTF-8.
#
# Ojo: esto NO cubre los nombres de los ficheros que se generan. Kotlin
# convierte cada nombre de test entre acentos graves en un fichero
# .class con ese mismo nombre, y ahí manda sun.jnu.encoding, que se
# deriva del locale del sistema y no se puede fijar desde aquí (el
# compilador corre en otro proceso). En una máquina con locale POSIX,
# un test llamado "`...enseñan...`" rompe el build con
# "InvalidPathException: unmappable characters". Por eso los nombres de
# test de este módulo se escriben sin tildes ni eñes: es la única forma
# de que compilen en cualquier máquina.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
